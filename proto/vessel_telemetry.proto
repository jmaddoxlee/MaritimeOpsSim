syntax = "proto3";

package maritimeopssim.telemetry;

// Placeholder telemetry contract for MaritimeOpsSim.
// This schema will be shared by the C++ simulation layer
// and the C#/.NET ingestion backend.

message VesselTelemetry {
  string vessel_id = 1;
  int64 timestamp_unix_ms = 2;
  uint64 sequence_number = 3;

  double x = 4;
  double y = 5;
  double speed = 6;
  double heading = 7;
  double fuel = 8;
  double signal_strength = 9;

  uint32 status_flags = 10;
}